<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e5b64"/>
      <stop offset="50%" stop-color="#c12048"/>
      <stop offset="100%" stop-color="#ffd1dc"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd1dc"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd1dc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd1dc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background badge with smooth rounded squircle -->
  <rect width="32" height="32" rx="8" fill="#1b1e2e"/>
  <!-- Ambient neonatal glow -->
  <circle cx="16" cy="11" r="5" fill="url(#sparkGlow)"/>
  <!-- Aurora dawn arc (protective incubator dome / sunrise) -->
  <path d="M6.5 21.5 C6.5 12.5, 25.5 12.5, 25.5 21.5" fill="none" stroke="url(#auroraGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vital rhythm pulse (ECG beat) -->
  <path d="M7 21.5 H12 L14.5 15.5 L17.5 25.5 L20 19 L22 21.5 H25" fill="none" stroke="url(#pulseGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vital spark -->
  <circle cx="16" cy="10.5" r="2" fill="#ffd1dc"/>
</svg>
